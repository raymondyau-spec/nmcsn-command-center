<title>NMCSN Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Adapted from Ryan Kohler's "Self Driving" monitor (2026-09-12): near-black, one red, bots as glowing nodes, a tour, a feed. Single committed look, painted explicitly. */
:root{ --bg:#F6FAFC; --panel:#FFFFFF; --panel-2:#EEF4F7; --line:#D0DDE4; --ink:#143044; --muted:#4E6878; --dim:#7A93A3; --red:#3A9CA8; --red-2:#2E7F8A; --green:#2F8A62; --yellow:#C4964A; --magenta:#C4964A; --white:#FFFFFF; --grey:#6E8798; }
/* Water and Metal for a Fire Snake (1977): deep water ground, silver ink, sea-glass as the one accent, sand for what waits on a person. No red. */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);}
h1,h2,h3{margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.disp{font-family:"Inter Tight",Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
.r{color:var(--red)}

/* header */
#hdr{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line)}
#hdr .wm{font-size:20px} #hdr .wm .r{margin-left:6px}
#hdr .live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)} #hdr .live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,179,191,.55)}50%{box-shadow:0 0 0 7px rgba(79,179,191,0)}}
#hdr .sp{flex:1} #hdr .who{font-size:12px;color:var(--muted)} #hdr .who b{color:var(--ink);font-weight:600}
#hdr .av{width:26px;height:26px;border-radius:50%;background:var(--red);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-right:8px}

/* ticker */
#tick{height:30px;overflow:hidden;position:relative;border-bottom:1px solid var(--line);background:#E8F1F5}
#tick .track{position:absolute;white-space:nowrap;animation:tick 80s linear infinite;line-height:30px;font-size:12px;color:var(--muted)}
#tick .track span{margin-right:56px} #tick .track b{color:var(--ink);font-weight:600}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* body grid */
#wrap{display:grid;grid-template-columns:72px minmax(0,1fr) 300px;min-height:0}
@media (max-width:1000px){#wrap{grid-template-columns:72px minmax(0,1fr)}#feedcol{display:none}}
#rail{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:12px 8px}
#rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:9px;font-size:10px;color:var(--dim);letter-spacing:.02em}
#rail button .ic{font-size:17px;line-height:1}
#rail button.on{color:var(--ink);background:var(--panel)} #rail button:hover{color:var(--ink)}
#stage{position:relative;min-width:0;min-height:600px;padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.top h2{font-size:28px} .top .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.note{color:var(--muted);font-size:12px}

/* waiting card + detail card */
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
.wait{position:absolute;left:22px;top:92px;max-width:420px;z-index:3}
.wait .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
.wait div.item{font-size:13px;padding:3px 0}
.detail{position:absolute;left:22px;bottom:22px;width:300px;z-index:3}
.detail .k{display:flex;gap:8px;align-items:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.detail h3{font-size:16px;font-weight:700}
.detail .d{color:var(--muted);font-size:12.5px;margin:4px 0 8px}
.detail .sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
.detail .li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.pill.live{background:rgba(111,207,159,.18);color:var(--green)} .pill.score{background:rgba(217,183,122,.2);color:var(--yellow)} .pill.human{background:rgba(217,183,122,.28);color:var(--magenta)} .pill.red{background:rgba(79,179,191,.18);color:var(--red-2)} .pill.grey{background:var(--panel-2);color:var(--muted)}

/* graph */
#graph{flex:1;width:100%;min-height:440px;border-radius:14px;background:radial-gradient(1200px 600px at 60% 40%,#DEEAF0 0%,#F6FAFC 70%);animation:tide 18s ease-in-out infinite alternate}
@keyframes tide{from{background-position:0 0}to{background-position:40px 20px}}
#graph text{font-family:Inter,sans-serif;fill:var(--ink);font-size:11px;font-weight:600}
#graph .lab2{fill:var(--muted);font-size:9.5px;font-weight:500}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted)} .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* sprint */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 14px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;flex:1}
.col{background:var(--panel);border-radius:12px;padding:12px;min-height:300px}
.col h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px} .col h3.hot{color:var(--red)}
.tcard{background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.tag{display:inline-block;background:rgba(79,179,191,.2);color:var(--red-2);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.tag.proc{background:rgba(110,110,122,.25);color:var(--muted)}
.tcard .t{font-size:13px;font-weight:600} .tcard .o{font-size:11.5px;color:var(--muted);margin-top:4px}
.tcard .ev{font-size:11px;color:var(--green);margin-top:4px} .tcard .ev.no{color:var(--red-2)}

/* board / process / setup */
.list{display:grid;gap:8px}
.epic{background:var(--panel);border-radius:12px;padding:14px 16px}
.epic h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin:8px 0 6px} .bar i{display:block;height:100%;background:var(--red)}
.ms{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.routine{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-radius:10px;padding:11px 14px}
.routine .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:11px}
.routine .n{font-weight:600} .routine .c{color:var(--muted);font-size:12px}
.setup{max-width:560px}
.setup label{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--panel);border-radius:9px;margin-bottom:6px;font-size:13px}

/* Hey Ray console */
#hey{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;background:#E8F1F5}
#hey .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
#hey textarea{width:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:13px;padding:9px 10px;resize:vertical}
#hey .row{display:flex;gap:8px;align-items:center}
#hey .mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:17px}
#hey .mic.on{background:var(--red);border-color:var(--red);animation:pulse 1.4s infinite}
#hey .send{flex:1;background:var(--red);color:#fff;border-radius:9px;padding:9px 12px;font-weight:600}
#hey .st{font-size:11.5px;color:var(--muted)}
#hey .spec{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;max-height:220px;overflow:auto;white-space:pre-wrap}
/* home: domains → engines */
.dom{margin-bottom:18px}
.dom h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:center}
.dom h3 .cnt{font-family:"Inter Tight",Inter,sans-serif;color:var(--dim)}
.eng{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:6px}
.ecard:hover{border-color:var(--red)}
.ecard .n{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ecard .p{font-size:12px;color:var(--muted)}
.ecard .m{display:flex;gap:6px;flex-wrap:wrap}
.ecard .next{font-size:12.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
.ecard .next b{color:var(--red-2);font-weight:600}
.ecard.private{border-style:dashed}
/* mine */
.mine{display:grid;gap:10px;max-width:760px}
.mine .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:14px 16px;border-left:4px solid var(--yellow)}
.mine .it .t{font-weight:600;font-size:15px} .mine .it .w{font-size:12.5px;color:var(--muted);margin-top:2px}
.mine .it a,.mine .it button{background:var(--red);color:#143044;border-radius:9px;padding:9px 12px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.mine .empty{color:var(--muted);padding:20px}
/* record (Baalda vault, read-only) */
.rec{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(0,1.4fr);gap:14px;flex:1;min-height:0}
@media (max-width:900px){.rec{grid-template-columns:1fr}}
.rec .side{display:flex;flex-direction:column;gap:8px}
.rec input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:14px;padding:11px 12px}
.hit{background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer;border:1px solid transparent}
.hit:hover,.hit.on{border-color:var(--red)}
.hit .t{font-weight:600;font-size:13.5px} .hit .p{font-size:11px;color:var(--muted);font-family:"Inter Tight",Inter,sans-serif}
#recnote{background:var(--panel);border-radius:12px;padding:18px 20px;overflow:auto;max-height:78vh;font-size:14px;line-height:1.55;color:var(--ink)}
#recnote h1,#recnote h2,#recnote h3{color:var(--ink);margin:14px 0 6px} #recnote h1{font-size:20px}#recnote h2{font-size:16px}#recnote h3{font-size:14px}
#recnote p{margin:0 0 10px} #recnote code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:12.5px} #recnote li{margin:2px 0}
#recnote table{border-collapse:collapse;font-size:12.5px;margin:8px 0} #recnote td,#recnote th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
/* feed */
#feedcol{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#feedcol .fh{padding:16px 16px 10px;border-bottom:1px solid var(--line)} #feedcol .fh b{font-size:13.5px;display:flex;gap:8px;align-items:center} #feedcol .fh small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
#feed{overflow:auto;padding:8px 12px;display:grid;gap:4px;align-content:start}
.post{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:8px 6px;border-radius:8px}
.post.lead{background:var(--panel)}
.post .av{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.post.human .av{background:var(--yellow);color:#143044}
.post .n{font-size:12.5px;font-weight:600} .post .n small{color:var(--dim);font-weight:400;margin-left:6px;font-size:10.5px}
.post p{margin:2px 0 0;font-size:12.5px;color:var(--ink);line-height:1.4}

#rail{overflow-y:auto;-webkit-overflow-scrolling:touch}
/* people roster — large type for phone */
.peoplewrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.85fr);gap:14px;align-items:start;flex:1;min-height:0}
@media (max-width:800px){.peoplewrap{grid-template-columns:1fr}.peoplewrap .detail{order:-1}}
.plist{display:grid;gap:18px;min-width:0}
.plist h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 8px}
.plist h4{font-size:15px;font-weight:700;color:var(--ink);margin:12px 0 8px}
.pcards{display:grid;gap:10px}
.pcard{display:grid;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);width:100%}
.pcard:hover,.pcard.on{border-color:var(--red)}
.pcard.on{box-shadow:0 0 0 2px rgba(58,156,168,.28)}
.pcard .row{display:flex;gap:12px;align-items:flex-start}
.pcard .av{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.pcard.human .av{background:var(--yellow);color:#143044}
.pcard .nm{font-size:20px;font-weight:800;letter-spacing:-.02em;font-family:"Inter Tight",Inter,sans-serif;line-height:1.15}
.pcard .job{font-size:15px;color:var(--muted);margin-top:3px}
.pcard .now{font-size:16px;color:var(--ink);line-height:1.4;border-top:1px solid var(--line);padding-top:8px}
.pcard .meta{margin-left:auto;flex-shrink:0}
.peoplewrap .detail{position:sticky;top:8px;width:auto;left:auto;bottom:auto}
.peoplewrap .detail h3{font-size:22px}
.peoplewrap .detail .d,.peoplewrap .detail .li,.peoplewrap .detail div[style]{font-size:15px!important}
/* github source-of-truth panel */
.gh{display:grid;gap:12px;max-width:760px}
.gh .card{padding:16px 18px}
.gh .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:8px}
.gh a{color:var(--red-2);font-weight:600;font-size:16px;text-decoration:none;word-break:break-word}
.gh a:hover{text-decoration:underline}
.gh .links{display:grid;gap:10px}
.gh .links a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gh p{font-size:16px;color:var(--ink);margin:0;line-height:1.45;word-break:normal}
.gh ul{margin:0;padding-left:18px}
.gh li{font-size:15.5px;color:var(--ink);margin:8px 0;line-height:1.4}
.gh .empty{color:var(--muted);font-size:15px}
@media (max-width:700px){.top h2{font-size:24px}.pcard .nm{font-size:22px}.pcard .now{font-size:17px}#hdr .wm{font-size:17px}}
</style>

nce rule)", "owner": "ray", "state": "backlog"}, {"id": "T308", "title": "Decide: survivor network as an NMCSN program or a partner's", "owner": "ray", "state": "backlog"}, {"id": "T309", "title": "Registry fields: readmission, rehab enrollment, survival, quality of life, distance traveled, by county", "owner": "steward", "state": "backlog"}]}]}, {"id": "M303", "title": "Prototype: 'Plan to home' panel on the receiving side at handoff", "state": "backlog", "projects": [{"id": "P303", "title": "After the transition pack is signed", "state": "backlog", "tasks": [{"id": "T310", "title": "Generate the plan-to-home checklist at handoff from the pack config; both screens", "owner": "builder", "state": "backlog"}]}]}], "files": ["nmcsn/2026-09-13_nmcsn_continuum-of-care.html", "nmcsn/2026-09-03_nmcsn-vision-board_corrected-n313.html", "nmcsn/rollout-roadmap.md", "nmcsn/HHNM-5-year-roadmap.md"]}], "thread": [{"t": "2026-09-12 18:05", "who": "ray", "text": "Let's stretch. Work on little simple things like STEMI… make a STEMI gate using the same processes."}, {"t": "2026-09-12 18:06", "who": "hey-ray", "text": "Pipeline: pack. Skill: systems-of-care-pack. Signer assumed: Ray (flagged). Tasks T4–T16 opened."}, {"t": "2026-09-12 18:40", "who": "ray", "text": "We have to design the system: Level 1, Level 2, PCI-capable or not. Key entry piece is the non-PCI site → interventionalist when lytics are indicated. AI reads the EKG; FDA program exists; fold it or build our own."}, {"t": "2026-09-12 18:41", "who": "hey-ray", "text": "Late requirements logged: designations at enrollment, entry piece, ECG reader registry. Builder re-scoped."}, {"t": "2026-09-12 19:20", "who": "builder", "text": "v0.22 inserted (45 KB). Syntax clean across 5 script blocks."}, {"t": "2026-09-12 19:26", "who": "builder", "text": "Browser run: 16/17 rule tests pass; arrival-time regex failed; out-of-order EKG line fell to fallback. Fixing."}, {"t": "2026-09-12 19:34", "who": "builder", "text": "Fixed: arrival  "who": "builder", "text": "All seven fixed. Timing answers resolve against the pending item; every decision frozen and audited; Demo I has its two new turns and completes with the call placed. v0.22.3 published. 60/60."}, {"t": "2026-09-13 00:32", "who": "hey-ray", "text": "STEMI pack is code-complete. One thing left and it is not a bot's: Ray answers the 16 signing decisions."}, {"t": "2026-09-13 01:10", "who": "ray", "text": "that model is perfect. Need two models: one fully AI, one with more human interaction — people won't be ready for straight AI."}, {"t": "2026-09-13 01:12", "who": "ray", "text": "Throw in the model where the receiving interventionalist joins the line and the AI just connects the two."}, {"t": "2026-09-13 01:40", "who": "builder", "text": "v0.23: physician-to-physician is the default at enrollment; AI connects the ER physician to the interventionalist (or shock physician), keeps record and clock, shows the guideline read as a card. AI-guided opt-in. Demo P added."}, {"t": "2026-09-13 02:10", "who": "ray", "text": "Always design for the user. The AI agent is a tool that connects doctors; these tools connect people, not the AI. Connector with intelligence: is it a STEMI, the accepting physician, the time, lytics are here, and if things fail we go here. All projects geared for New Mexico rural health."}, {"t": "2026-09-13 02:30", "who": "builder", "text": "Connector card built: five things on both screens; guideline read behind a tap. Design law written into both skills; ER physician panel added to the roster."}, {"t": "2026-09-13 03:05", "who": "ray", "text": "Allow an accelerated pathway: frustrated doctors will just say 'connect me to the interventionalist'. It has to be very nimble."}, {"t": "2026-09-13 03:12", "who": "ray", "text": "The agent should be a scribe, not make recommendations; clinical decisions are for real doctors. EKG, STEMI, connect me to the interventionalist, boom. No AI narrative — that's for someone without the understanding."}, {"t": "2026-09-13 03:40", "who": "builder", "text": "Scribe is now the default model; Guided is opt-in; Express connects on the first words or one tap. ECG photo → one-line read → dial. 104/104 tests."}, {"t": "2026-09-13 04:20", "who": "ray", "text": "Multiple people in the chain: ER physician, charge nurses, house supervisor (beds), receiving ED physician. Who needs to know, what they need, roll out in stages: phones → three-way call → automation. Every condition needs its own team."}, {"t": "2026-09-13 04:22", "who": "ray", "text": "Add this as a skill; my development team will integrate it into our Systems Builder."}, {"t": "2026-09-13 04:55", "who": "builder", "text": "v0.24: chain config, notifications off events, chain panel, rollout stages. Pack skill gained chain.template.md and SYSTEMS-BUILDER.md. Chain sheet and signing sheet are tap pages."}, {"t": "2026-09-13 05:40", "who": "ray", "text": "i signed the stemi pack"}, {"t": "2026-09-13 05:45", "who": "scribe", "text": "STEMI pack signed: approved_by Ray Yau, all sixteen defaults kept; signature recomputed; v0.24.1 published."}, {"t": "2026-09-13 07:30", "who": "builder", "text": "Command center recolored: deep water, silver ink, sea-glass accent, sand for what waits on a person. Roster gains Pacer (Water), Steward (Earth·Metal), Growth (Wood); every bot now carries its element."}, {"t": "2026-09-13 08:50", "who": "scribe", "text": "Team-vault inventory landed: registry, publications, conferences, funding, governance, website, staffing, education, partnerships, network operations, trials & literature. Every task and date is from the notes; caveats in inventoryNotes."}, {"t": "2026-09-13 09:40", "who": "ray", "text": "Add the full systems of care, not just acute: post-hospital follow-up, education, cardiac rehab, diet — something for everyone, plans from beginning to end."}, {"t": "2026-09-13 10:05", "who": "builder", "text": "Continuum page written (recognize → one call → treat → recover → transition → follow up → thrive; something-for-everyone matrix; three post-acute packs; rural rules). Engine 'Continuum of care' opened with the transition pack first."}, {"t": "2026-09-13 10:20", "who": "ray", "text": "The discharge-planning and follow-up piece could be its own app that hospitals buy or license and we distribute."}, {"t": "2026-09-13 10:40", "who": "ray", "text": "Table the continuum for now."}, {"t": "2026-09-13 10:41", "who": "pacer", "text": "Continuum engine and product line 2 parked in backlog; nothing waits on Ray from them. Live focus stays: STEMI chain sheet, Grok Bot command center, conferences."}], "sprint": {"name": "STEMI pack sprint (keep board moving)", "from": "2026-09-12", "to": "2026-09-19"}, "routines": [{"id": "R1", "name": "Hey Ray spec", "cadence": "per directive", "owner": "hey-ray", "text": "Spoken ask → spec in Ray's words → intake → pipeline → tasks opened"}, {"id": "R2", "name": "Pack pipeline", "cadence": "per project", "owner": "builder", "text": "scaffold → build → clinical + code review in parallel → fix → produce → scribe → retro"}, {"id": "R3", "name": "Daily sync", "cadence": "every day", "owner": "scribe", "text": "vault + Downloads + hub in sync; thread appended; open evaluations listed"}, {"id": "R4", "name": "Weekly retro", "cadence": "every Monday", "owner": "retro", "text": "read the week's evaluation records; edit the skills; log the diff"}, {"id": "R5", "name": "Landscape refresh", "cadence": "every week", "owner": "landscaper", "text": "one section: competitor, regulator or precedent, with dates and sources"}, {"id": "R6", "name": "Counsel open questions", "cadence": "every week", "owner": "counsel-prep", "text": "refresh the one-page list for Ward; disclosure log current"}, {"id": "R7", "name": "Pack signing", "cadence": "per pack", "owner": "ray", "text": "signer confirms thresholds and wording; approved_by filled; signature recomputed"}, {"id": "R8", "name": "Floor republish", "cadence": "after every run", "owner": "scribe", "text": "board.json updated; floor artifact republished"}]}</script>
<script>
const B=JSON.parse(document.getElementById('board').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=Object.fromEntries(B.agents.map(a=>[a.id,a])); const ag=id=>A[id]||{id,name:id,kind:'bot',status:'idle',job:'',now:''};
const E=Object.fromEntries(B.engines.map(e=>[e.id,e]));
const TASKS=[]; for(const e of B.epics) for(const m of e.milestones) for(const p of m.projects) for(const t of p.tasks) TASKS.push({...t, epic:e, ms:m, pr:p, engine:e.engine});
const PROJECTS=[]; for(const e of B.epics) for(const m of e.milestones) for(const p of m.projects) PROJECTS.push({...p, epic:e, ms:m, engine:e.engine, tasks:p.tasks});
const initials=n=>n.split(/[\s\/·]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const score=ts=>({done:ts.filter(t=>t.state==='done'&&t.evaluation).length,total:ts.length});
let view=(matchMedia('(max-width: 700px)').matches?'mine':'home'), focus=null, tour=null, speak=false, claimed=[]; try{ claimed=JSON.parse(localStorage.getItem('factory-claimed')||'[]'); }catch(e){}
const F={engine:'',bot:''};

/* ---------- ticker + feed ---------- */
function ticker(){ const items=B.thread.slice(-12).reverse().map(ev=>`<span><b>${esc(ag(ev.who).name)}</b> · ${esc(ev.text)}</span>`).join(''); $('#track').innerHTML=items+items; }
function feed(){ const th=B.thread.slice().reverse(); const fid=focus&&(focus.kind==='bot'||focus.kind==='human')?((focus.ref&&focus.ref.id)||focus.id):null; const list=fid?th.filter(e=>e.who===fid).concat(th.filter(e=>e.who!==fid)):th;
  $('#fhb').innerHTML=fid?esc(ag(fid).name)+' <span class="pill live">live</span>':'What\'s happening'; $('#fhs').textContent=fid?(ag(fid).job):'watching along · the team talking';
  $('#feed').innerHTML=list.slice(0,14).map((ev,i)=>{ const a=ag(ev.who); return `<div class="post ${i===0?'lead':''} ${a.kind}"><div class="av">${esc(initials(a.name))}</div><div><div class="n">${esc(a.name)}<small>${esc(ev.t.slice(11))}</small></div><p>${esc(ev.text)}</p></div></div>`; }).join(''); }
function say(t){ if(!speak||!('speechSynthesis' in window)) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.03; const v=speechSynthesis.getVoices().find(v=>/Samantha|Ava|Zira|Google US English/.test(v.name)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }
$('#voice').onclick=()=>{ speak=!speak; $('#voice').classList.toggle('on',speak); $('#voice').textContent=speak?'🔊 Commentator on':'🔈 Commentator'; if(speak) say(focus?describe(focus):'Commentator on. The team is moving.'); else try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- graph model ---------- */
let NODES=[], EDGES=[], simT=0, vb={x:0,y:0,w:1000,h:620}, vbT={x:0,y:0,w:1000,h:620};
function buildGraph(kind){ NODES=[]; EDGES=[]; const add=(n)=>{ n.x=n.x??(500+(Math.random()-.5)*600); n.y=n.y??(310+(Math.random()-.5)*380); n.vx=0; n.vy=0; NODES.push(n); return n; }; const byId={};
  const bots=B.agents.map(a=>add({id:'a:'+a.id,kind:a.kind==='human'?'human':'bot',ref:a,label:a.name.replace(' Reviewer','').replace('Retro / Skill-Forge','Retro'),r:a.kind==='human'?9:(a.status==='active'?15:11),glow:a.status==='active'}));
  const engs=B.engines.map(e=>add({id:'e:'+e.id,kind:'engine',ref:e,label:e.name.split(' (')[0].replace(' & packs','').replace(' & strategy',''),r:kind==='engines'?22:16}));
  const projs=PROJECTS.filter(p=>p.state!=='backlog').map(p=>add({id:'p:'+p.id,kind:'project',ref:p,label:p.title,r:kind==='projects'?10:5}));
  const routs=kind==='projects'?B.routines.map(r=>add({id:'r:'+r.id,kind:'process',ref:r,label:r.name,r:6})):[];
  for(const n of NODES) byId[n.id]=n;
  for(const n of projs){ const p=n.ref; EDGES.push([n,byId['e:'+p.engine],.6]); for(const o of new Set(p.tasks.map(t=>t.owner))) if(byId['a:'+o]) EDGES.push([byId['a:'+o],n,1]); }
  for(const a of B.agents){ const engSet=new Set(TASKS.filter(t=>t.owner===a.id).map(t=>t.engine)); for(const e of engSet) EDGES.push([byId['a:'+a.id],byId['e:'+e],.35]); }
  for(const n of routs){ const r=n.ref; if(byId['a:'+r.owner]) EDGES.push([n,byId['a:'+r.owner],.8]); }
  for(let i=0;i<260;i++) simStep(0.9); vb={x:0,y:0,w:1000,h:620}; vbT={...vb}; }
function simStep(k){ for(let i=0;i<NODES.length;i++){ const a=NODES[i]; for(let j=i+1;j<NODES.length;j++){ const b=NODES[j]; let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy+0.01; const min=(a.r+b.r)*3; const f=Math.min(1200/d2, 2)+(d2<min*min?0.6:0); const d=Math.sqrt(d2); dx/=d; dy/=d; a.vx+=dx*f*k; a.vy+=dy*f*k; b.vx-=dx*f*k; b.vy-=dy*f*k; } }
  for(const [a,b,s] of EDGES){ if(!a||!b) continue; const dx=b.x-a.x, dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)+0.01; const L=90+ (a.r+b.r)*2; const f=(d-L)*0.012*s; a.vx+=dx/d*f*k; a.vy+=dy/d*f*k; b.vx-=dx/d*f*k; b.vy-=dy/d*f*k; }
  for(const n of NODES){ n.vx+=(500-n.x)*0.0025*k; n.vy+=(310-n.y)*0.0025*k; n.vx*=0.82; n.vy*=0.82; n.x+=n.vx; n.y+=n.vy; n.x=Math.max(30,Math.min(970,n.x)); n.y=Math.max(30,Math.min(590,n.y)); } }
function drawGraph(){ const g=$('#graph'); if(!g) return; simStep(0.15); simT++; if(simT%2) for(const n of NODES) if(n.glow){ n.x+=Math.sin(simT/40+n.r)*0.15; n.y+=Math.cos(simT/50+n.r)*0.15; }
  vb.x+=(vbT.x-vb.x)*0.08; vb.y+=(vbT.y-vb.y)*0.08; vb.w+=(vbT.w-vb.w)*0.08; vb.h+=(vbT.h-vb.h)*0.08; g.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const col=n=>n.kind==='engine'?'#4FB3BF':n.kind==='project'?'#3C7D9C':n.kind==='process'?'#6E8798':n.kind==='human'?'none':'#FBFCFD';
  const dim=n=>focus&&focus.id!==n.id&&!EDGES.some(([a,b])=>(a===focus&&b===n)||(b===focus&&a===n));
  g.innerHTML=`<defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowr" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`+
    EDGES.map(([a,b])=>a&&b?`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${(focus&&(a===focus||b===focus))?'#4FB3BF':'#1C3447'}" stroke-opacity="${(focus&&(a===focus||b===focus))?.9:.7}" stroke-width="${(focus&&(a===focus||b===focus))?1.6:1}"/>`:'').join('')+
    NODES.map(n=>{ const st=n.ref.status; const glow=n.kind==='engine'?'url(#glowr)':(n.glow?'url(#glow)':'none'); const stroke=n.kind==='human'?(st==='blocked-on'?'#C4964A':'#143044'):n.kind==='bot'?(n.id===(focus&&focus.id)?'#C4964A':'#3A9CA8'):(n.id===(focus&&focus.id)?'#C4964A':'none');
      const sc=n.kind==='bot'||n.kind==='human'?score(TASKS.filter(t=>t.owner===n.ref.id)):n.kind==='engine'?score(TASKS.filter(t=>t.engine===n.ref.id)):n.kind==='project'?score(n.ref.tasks):null;
      return `<g data-id="${n.id}" opacity="${dim(n)?.28:1}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${col(n)}" fill-opacity="${n.kind==='project'?.9:1}" stroke="${stroke}" stroke-width="2" filter="${glow}"/>${n.kind==='bot'&&st==='blocked-on'?`<circle cx="${n.x}" cy="${n.y}" r="${n.r+5}" fill="none" stroke="#C4964A" stroke-width="1.5"/>`:''}${(n.kind!=='project'&&n.kind!=='process')||view==='projects'||n.id===(focus&&focus.id)?`<text x="${n.x+n.r+6}" y="${n.y+3}">${esc(n.label.length>26?n.label.slice(0,25)+'…':n.label)}</text>`:''}${sc&&(n.kind!=='project'||view==='projects')?`<text class="lab2" x="${n.x+n.r+6}" y="${n.y+15}" fill="${st==='active'?'#2F8A62':st==='blocked-on'?'#C4964A':'#4E6878'}">${n.kind==='bot'||n.kind==='human'?(st==='active'?'live':st==='blocked-on'?'waiting on you':st):''}${sc.total?' · '+sc.done+'/'+sc.total:''}</text>`:''}</g>`; }).join('');
  g.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{ setFocus(NODES.find(n=>n.id===el.dataset.id)); stopTour(); }); }
function setFocus(n){ focus=n; if(n&&Number.isFinite(n.x)&&Number.isFinite(n.y)){ const w=420,h=260; vbT={x:n.x-w/2,y:n.y-h/2,w,h}; } else if(!n) vbT={x:0,y:0,w:1000,h:620}; detail(); feed(); }
function describe(n){ if(!n) return ''; if(n.kind==='bot'||n.kind==='human'){ const a=n.ref; return a.name+', '+a.job.toLowerCase()+'. '+(a.status==='active'?'Live: ':a.status==='blocked-on'?'Waiting on this person: ':'')+a.now; } if(n.kind==='engine'){ const s=score(TASKS.filter(t=>t.engine===n.ref.id)); return n.ref.name+': '+s.done+' of '+s.total+' tasks done and evaluated.'; } if(n.kind==='project'){ const s=score(n.ref.tasks); return 'Project '+n.ref.title+', '+n.ref.state+', '+s.done+' of '+s.total+' done.'; } return 'Routine '+n.ref.name+', '+n.ref.cadence+'. '+n.ref.text; }
function detail(){ const d=$('#detail'); if(!d) return; if(!focus){ d.hidden=true; return; } d.hidden=false; const n=focus;
  if(n.kind==='bot'||n.kind==='human'){ const a=n.ref; const engs=[...new Set(TASKS.filter(t=>t.owner===a.id).map(t=>t.engine))]; d.innerHTML=`<div class="k">${a.kind==='human'?'person':'bot'} ${a.element?'<span class="pill grey">'+esc(a.element)+'</span> ':''}${a.status==='active'?'<span class="pill live">live</span>':a.status==='blocked-on'?'<span class="pill human">waiting on you</span>':'<span class="pill grey">'+a.status+'</span>'}</div><h3>${esc(a.name)}</h3><div class="d">${esc(a.job)}</div><div class="sec">Engines</div>${engs.map(e=>{ const eng=E[e]; if(!eng) return ''; const s=score(TASKS.filter(t=>t.owner===a.id&&t.engine===e)); return `<div class="li"><span>${esc(eng.name.split(' (')[0])}</span><span class="pill score">${s.done}/${s.total}</span></div>`; }).join('')||'<div class="li"><span class="note">no tasks</span></div>'}<div class="sec">Now</div><div style="font-size:13px">${esc(a.now)}</div>`; }
  else if(n.kind==='engine'){ const e=n.ref; const ts=TASKS.filter(t=>t.engine===e.id); const s=score(ts); const bots=[...new Set(ts.map(t=>t.owner))]; d.innerHTML=`<div class="k">engine <span class="pill score">${s.done}/${s.total}</span></div><h3>${esc(e.name)}</h3><div class="d">${bots.length} on it · ${PROJECTS.filter(p=>p.engine===e.id).length} projects · ${B.routines.filter(r=>bots.includes(r.owner)).length} processes · ${s.done}/${s.total} work done</div><div class="sec">Team</div>${bots.map(b=>`<div class="li"><span>${esc(ag(b).name)}</span>${ag(b).status==='active'?'<span class="pill live">live</span>':ag(b).status==='blocked-on'?'<span class="pill human">waiting</span>':'<span class="pill grey">'+ag(b).status+'</span>'}</div>`).join('')}`; }
  else if(n.kind==='project'){ const p=n.ref; const s=score(p.tasks); d.innerHTML=`<div class="k">project <span class="pill score">${s.done}/${s.total}</span> <span class="pill ${p.state==='active'?'live':'grey'}">${p.state}</span></div><h3>${esc(p.title)}</h3><div class="d">${esc(p.ms.title)} · ${esc(E[p.engine].name.split(' (')[0])}</div><div class="sec">Tasks</div>${p.tasks.map(t=>`<div class="li"><span>${esc(t.title.length>42?t.title.slice(0,41)+'…':t.title)}</span><span class="pill ${t.state==='done'?'live':t.state==='active'?'score':'grey'}">${t.state}</span></div>`).join('')}`; }
  else { const r=n.ref; d.innerHTML=`<div class="k">process <span class="pill grey">${esc(r.cadence)}</span></div><h3>${esc(r.name)}</h3><div class="d">${esc(r.text)}</div><div class="sec">Owner</div><div class="li"><span>${esc(ag(r.owner).name)}</span></div>`; } }
function startTour(){ stopTour(); const order=NODES.filter(n=>n.kind!=='process'&&(view!=='team'||n.kind!=='project')).sort((a,b)=>(b.glow?1:0)-(a.glow?1:0)); let i=0; const go=()=>{ setFocus(order[i%order.length]); say(describe(focus)); i++; }; go(); tour=setInterval(go,7000); $('#tourbtn').textContent='❚❚ Pause tour'; }
function stopTour(){ if(tour){ clearInterval(tour); tour=null; } const b=$('#tourbtn'); if(b) b.textContent='▶ Resume tour'; }

/* ---------- views ---------- */
function graphView(title, red, sub, kind){ const humans=TASKS.filter(t=>t.state!=='done'&&ag(t.owner).kind==='human'); return `<div class="top"><div><h2 class="disp">${title} <span class="r">${red}</span></h2><div class="sub">${sub}</div></div><span class="sp"></span><button class="btn" id="zoomout">⤢ Zoom out</button><button class="btn" id="tourbtn">▶ Resume tour</button></div>
  ${kind==='team'&&humans.length?`<div class="card wait"><div class="k">Waiting on you</div>${humans.slice(0,5).map(t=>`<div class="item">${esc(t.title)} <span class="pill human">${esc(ag(t.owner).name.split(' ')[0])}</span></div>`).join('')}</div>`:''}
  <svg id="graph" viewBox="0 0 1000 620" role="img" aria-label="Live graph of bots, engines and projects"></svg>
  <div class="card detail" id="detail" hidden></div>
  <div class="legend"><span><i style="background:#FBFCFD;border:2px solid #3A9CA8;width:7px;height:7px;box-sizing:border-box"></i>bot</span><span><i style="background:none;border:2px solid #143044;width:7px;height:7px"></i>person</span><span><i style="background:#4FB3BF"></i>engine</span><span><i style="background:#3C7D9C"></i>project</span><span><i style="background:#6E8798"></i>process</span><span class="note">· scores are evaluated work done, nothing invented</span></div>`; }
function team(){ const n=B.agents.length, live=B.agents.filter(a=>a.status==='active').length, wait=TASKS.filter(t=>t.state!=='done'&&ag(t.owner).kind==='human').length; return graphView('Team is','moving',`NMCSN house · ${n} on the team · ${live} live · ${wait} waiting on a person · ${esc(B.sprint.name)}`,'team'); }
function engines(){ return graphView(B.engines.length===3?'Three':B.engines.length,'engines','Click a cluster to zoom. Scores are evaluated work done, nothing invented.','engines'); }
function projects(){ return graphView('Projects','and processes',`${PROJECTS.filter(p=>p.state!=='backlog').length} projects live · ${B.routines.length} processes · scores are milestones and work done`,'projects'); }
function sprint(){ const inprog=TASKS.filter(t=>t.state==='active').length, wait=TASKS.filter(t=>t.state!=='done'&&ag(t.owner).kind==='human').length; const filt=t=>(!F.engine||t.engine===F.engine)&&(!F.bot||t.owner===F.bot);
  const col=(s,label,hot)=>{ const ts=TASKS.filter(t=>t.state===s&&filt(t)); const rts=s==='sprint'?B.routines.filter(r=>(!F.bot||r.owner===F.bot)&&!F.engine):[]; return `<div class="col"><h3 class="${hot?'hot':''}">${label} · ${ts.length+rts.length}</h3>${ts.map(t=>`<div class="tcard"><span class="tag">project</span><div class="t">${esc(t.title)}</div><div class="o">${esc(ag(t.owner).name)} · ${esc(t.ms.title)}</div>${t.state==='done'?(t.evaluation?`<div class="ev">✓ ${esc(t.evaluation.result.length>70?t.evaluation.result.slice(0,69)+'…':t.evaluation.result)}</div>`:'<div class="ev no">✗ done without an evaluation</div>'):''}</div>`).join('')}${rts.map(r=>`<div class="tcard"><span class="tag proc">process</span><div class="t">${esc(r.name)}</div><div class="o">${esc(ag(r.owner).name)} · ${esc(r.cadence)}</div></div>`).join('')}</div>`; };
  return `<div class="top"><div><h2 class="disp">Sprint <span class="r">board</span></h2><div class="sub">${esc(B.sprint.name)} · ${B.sprint.from} → ${B.sprint.to} · ${B.agents.filter(a=>a.kind==='bot').length} bots · ${inprog} in progress · ${wait} waiting on a person</div></div></div>
  <div class="chips"><button class="chip ${!F.engine?'on':''}" data-e="">All engines</button>${B.engines.map(e=>`<button class="chip ${F.engine===e.id?'on':''}" data-e="${e.id}">${esc(e.name.split(' (')[0].replace(' & packs','').replace(' & strategy',''))}</button>`).join('')}</div>
  <div class="chips"><button class="chip ${!F.bot?'on':''}" data-b="">All bots</button>${B.agents.map(a=>`<button class="chip ${F.bot===a.id?'on':''}" data-b="${a.id}">${esc(a.name.replace(' Reviewer','').replace('Retro / Skill-Forge','Retro'))}</button>`).join('')}</div>
  <div class="cols">${col('backlog','Backlog',true)}${col('sprint','Sprint')}${col('active','Active')}${col('done','Done')}</div>`; }
function board(){ const pct=ts=>ts.length?Math.round(100*ts.filter(t=>t.state==='done').length/ts.length):0; return `<div class="top"><div><h2 class="disp">Epics <span class="r">and milestones</span></h2><div class="sub">epic → milestone → project → task → evaluation · a task is done only with an evaluation record</div></div></div><div class="list">${B.epics.map(e=>{ const ts=TASKS.filter(t=>t.epic.id===e.id); return `<div class="epic"><h3>${esc(e.title)} <span class="pill score">${pct(ts)}%</span></h3><div class="bar"><i style="width:${pct(ts)}%"></i></div>${e.milestones.map(m=>{ const mts=TASKS.filter(t=>t.ms.id===m.id); return `<div class="ms"><span>${esc(m.title)}<span class="note"> · ${m.projects.length} project${m.projects.length>1?'s':''}</span></span><span class="pill ${m.state==='done'?'live':m.state==='active'?'score':'grey'}">${m.state}</span><span class="note">${pct(mts)}%</span></div>`; }).join('')}</div>`; }).join('')}</div>`; }
function process(){ return `<div class="top"><div><h2 class="disp">Routines <span class="r">the drumbeat</span></h2><div class="sub">processes run on a cadence; projects run to a milestone. Both land on the same board.</div></div></div><div class="list">${B.routines.map(r=>`<div class="routine"><div class="ck">✓</div><div><div class="n">${esc(r.name)}</div><div class="c">${esc(r.text)}</div></div><div class="c">${esc(r.cadence)} · ${esc(ag(r.owner).name)}</div></div>`).join('')}</div>`; }
function engineStats(e){ const ts=TASKS.filter(t=>t.engine===e.id); const done=ts.filter(t=>t.state==='done').length; const act=ts.filter(t=>t.state==='active').length; const mine=ts.filter(t=>t.owner==='ray'&&t.state!=='done'); const next=ts.find(t=>t.state==='active')||ts.find(t=>t.state==='sprint')||ts.find(t=>t.state==='backlog'); const ms=[]; for(const ep of B.epics) if(ep.engine===e.id) for(const m of ep.milestones) ms.push(m); const activeMs=ms.find(m=>m.state==='active'); return {ts,done,act,mine,next,ms,activeMs}; }
function home(){ const doms={}; for(const e of B.engines){ (doms[e.domain||'NMCSN']=doms[e.domain||'NMCSN']||[]).push(e); } const order=['Today','ONE CALL & packs','NMCSN','Science & publications','Speaking & conferences','Funding, governance & legal','NewCo','Personal','Process'];
  const keys=Object.keys(doms).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));
  const waiting=TASKS.filter(t=>t.owner==='ray'&&t.state!=='done').length; const live=B.agents.filter(a=>a.status==='active').length;
  return `<div class="top"><div><h2 class="disp">Everything <span class="r">in one place</span></h2><div class="sub">${B.engines.length} engines · ${TASKS.length} tasks · ${live} bots live · <b style="color:var(--yellow)">${waiting} waiting on you</b> · ${esc(B.sprint.name)}</div></div><span class="sp"></span><button class="btn" onclick="view='mine';render()">☑ Mine</button></div>
  ${keys.map(k=>`<div class="dom"><h3>${esc(k)} <span class="cnt">${doms[k].length}</span></h3><div class="eng">${doms[k].map(e=>{ const st=engineStats(e); const pct=st.ts.length?Math.round(100*st.done/st.ts.length):0; return `<div class="ecard ${e.private?'private':''}" data-eng="${e.id}"><div class="n"><span>${esc(e.name)}</span><span class="pill ${st.act?'live':e.state==='done'?'grey':'score'}">${st.act?st.act+' live':e.state||'—'}</span></div><div class="p">${esc(e.purpose||'')}${e.lastTouched?' · last touched '+esc(e.lastTouched):''}</div><div class="m"><span class="pill grey">${pct}% · ${st.done}/${st.ts.length}</span>${st.mine.length?`<span class="pill human">${st.mine.length} on you</span>`:''}${st.activeMs?`<span class="pill grey">${esc(st.activeMs.title.length>34?st.activeMs.title.slice(0,33)+'…':st.activeMs.title)}</span>`:''}</div>${st.next?`<div class="next"><b>Next:</b> ${esc(st.next.title)} <span class="note">· ${esc(ag(st.next.owner).name)}</span></div>`:''}</div>`; }).join('')}</div></div>`).join('')}`; }
const LINKS={T37:'https://claude.ai/code/artifact/d9d0cb9e-3bc9-4fba-ab00-d510811e3a9b',T38:'https://claude.ai/code/artifact/9755e900-33f9-4f3d-b0d0-1812e811a611',T16:'https://claude.ai/code/artifact/9755e900-33f9-4f3d-b0d0-1812e811a611',T31:'https://claude.ai/code/artifact/9755e900-33f9-4f3d-b0d0-1812e811a611'};
function mine(){ const its=TASKS.filter(t=>t.owner==='ray'&&t.state!=='done'); const human=TASKS.filter(t=>ag(t.owner).kind==='human'&&t.owner!=='ray'&&t.state!=='done');

function record(){ return `<div class="top"><div><h2 class="disp">The <span class="r">record</span></h2><div class="sub">Your NMCSN vault in Baalda, read-only, under your own login. The bots write the record; this page reads it.</div></div></div>

function md(t){ let h=esc(t); h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'); h=h.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.*\|\n?)+)/gm,(m,head,sep,body)=>{ const cells=r=>r.split('|').slice(1,-1).map(c=>'<td>'+c.trim()+'</td>').join(''); return '<table><tr>'+cells(head).replace(/td>/g,'th>')+'</tr>'+body.trim().split('\n').map(r=>'<tr>'+cells(r)+'</tr>').join('')+'</table>'; }); h=h.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\n<li>)/g,'<ul>$1</ul>'); return h.split(/\n{2,}/).map(p=>/^<(h\d|ul|table)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join(''); }
async function recSearch(q){ REC.q=q; REC.hits=[]; REC.err=''; REC.busy=true; render(); try{ const mcp=await claude.use('mcp'); if(!mcp){ REC.err='Baalda is not reachable from this device (connector not connected in this view).'; REC.busy=false; render(); return; } if(!REC.vault){ const r=await mcp.callTool('Baalda-NMCSN','list_vaults',{}); const vs=(r.payload&&r.payload.results)||[]; REC.vault=(vs.find(v=>/nmcsn/i.test(v.name))||vs[0]||{}).vaultId; } const r2=await mcp.callTool('Baalda-NMCSN','search_notes',{vaultId:REC.vault,query:q,k:12}); REC.hits=(r2.payload&&r2.payload.results)||[]; }catch(e){ REC.err='Search failed: '+(e&&e.code?e.code:'unavailable'); } REC.busy=false; render(); }

function pcard(a){ const on=focus&&focus.ref&&focus.ref.id===a.id; const pill=a.status==='active'?'live':a.status==='blocked-on'?'human':'grey'; const sl=a.status==='active'?'live':a.status==='blocked-on'?'waiting on you':(a.status||''); return `<button type="button" class="pcard ${a.kind} ${on?'on':''}" data-agent="${esc(a.id)}"><div class="row"><span class="av">${esc(initials(a.name))}</span><div style="min-width:0;flex:1"><div class="nm">${esc(a.name)}</div><div class="job">${esc(a.job||'')}</div></div><span class="meta pill ${pill}">${esc(sl)}</span></div>${a.now?`<div class="now">${esc(a.now)}</div>`:''}</button>`; }

async function postDirective(text){ if(!text.trim()) return; const t=new Date(); const stamp=t.toISOString().slice(0,16).replace('T',' '); $('#heyst').textContent='Posting…'; await play('gotit');
  const ev={t:stamp, who:'ray', text:text.trim()}; B.thread.push(ev);
  let spec=''; if(SAMPLE){ try{ $('#heyspec').hidden=false; $('#heyspec').textContent='Drafting the spec…'; const r=await SAMPLE('You are Hey Ray, the founder clone in the NMCSN systems-of-care factory (bots build, people sign; default interaction model is Scribe; rural New Mexico first). Engines on the board: '+B.engines.map(e=>e.id+' = '+e.name).join('; ')+'. Turn this spoken directive into a spec in the owner\'s own words: 1) what he asked, verbatim; 2) the engine it belongs to (or NEW ENGINE: name); 3) pipeline (pack / document / process / decision); 3) five to eight tasks with an owner bot each (Scaffolder, Builder, Clinical Safety Reviewer, Code & Test Reviewer, Producer, Scribe, Landscaper, Counsel-prep, Retro) and the human items (signer, owner decisions) kept separate; 4) what must be true before it ships. Plain text, under 220 words, no markdown symbols.\n\nDirective: '+text, {modelTier:'default'}); spec=r.text||''; $('#heyspec').textContent=spec; }catch(e){ $('#heyspec').textContent='Spec drafting is not available on this device; the directive is posted as is.'; } }
  const id='d'+Date.now(); try{ await DB.doc('directives/'+id).set({t:stamp, text:text.trim(), spec, status:'new', by:'Ray Yau'}); B.thread.push({t:stamp, who:'hey-ray', text:'Directive received and spec drafted; posted to the board for the next run.'}); await DB.doc('board/current').set(JSON.parse(JSON.stringify(B))); $('#heyst').textContent='Posted. The bots pick it up on the next run.'; await play('posted'); }catch(e){ $('#heyst').textContent='Could not save to the board from this device; the words are kept on screen.'; await play('offline'); }
  $('#heyin').value=''; ticker(); render(); }
$('#heysend').onclick=()=>postDirective($('#heyin').value);
(function(){ const R=window.SpeechRecognition||window.webkitSpeechRecognition; const mic=$('#heymic'); if(!R){ mic.title='Voice input needs Safari on iPhone or Chrome on the Mac'; mic.style.opacity=.5; return; } let rec=null; mic.onclick=async()=>{ if(rec){ try{ rec.stop(); }catch(e){} return; } await play('hey'); rec=new R(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=true; mic.classList.add('on'); $('#heyst').textContent='Listening… tap the mic again when you are done.'; let final=''; rec.onresult=e=>{ let s=''; for(const r of e.results){ s+=r[0].transcript+' '; if(r.isFinal) final=s; } $('#heyin').value=s.trim(); }; rec.onend=()=>{ mic.classList.remove('on'); rec=null; $('#heyst').textContent=$('#heyin').value?'Review it, then Send to the factory.':'Nothing heard.'; }; rec.onerror=()=>{ mic.classList.remove('on'); rec=null; }; try{ rec.start(); }catch(e){ mic.classList.remove('on'); rec=null; } }; })();
(function loop(){ drawGraph(); requestAnimationFrame(loop); })();
let tk=5; setInterval(()=>{ tk=tk<=1?5:tk-1; $('#tickn').textContent=tk+'s'; },1000);
</script>
